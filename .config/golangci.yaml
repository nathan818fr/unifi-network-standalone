# Passed by the lint and fmt tasks of mise: golangci-lint only looks for its configuration at the root
# of the repository.
version: "2"

linters:
  # gosec and noctx are left out: they flag the commands and files this project runs on purpose.
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - intrange
    - misspell
    - nolintlint
    - perfsprint
    - unconvert
    - usestdlibvars

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nathan818fr/unifi-network-standalone/image
