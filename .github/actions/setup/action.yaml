name: Set up tools
description: Installs mise and the tools at the versions in mise.lock

runs:
  using: composite
  steps:
    # Else installing a tool re-locks them all, which can change mise.lock.
    - shell: bash
      run: printf 'MISE_LOCKED=1\n' >>"$GITHUB_ENV"
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
